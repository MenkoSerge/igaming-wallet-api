version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: igaming-postgres
    environment:
      POSTGRES_DB: igaming_wallet
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: wallet_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: igaming-wallet-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/igaming_wallet
      SPRING_DATASOURCE_USERNAME: wallet_user
      SPRING_DATASOURCE_PASSWORD: wallet_pass
    depends_on:
      - postgres

volumes:
  postgres_data: